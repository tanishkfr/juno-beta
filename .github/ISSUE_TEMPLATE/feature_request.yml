name: Feature request
description: Suggest an improvement for a later Juno Beta
title: "[Feature] "
labels: ["enhancement", "beta"]
body:
  - type: markdown
    attributes:
      value: |
        Juno Beta 0.3 is a bounded private Beta. Feature requests are welcome, but they may be
        deferred until after Beta stabilization. Please describe the user problem, not only the UI
        you want.
  - type: input
    id: version
    attributes:
      label: Juno version
      placeholder: "Juno Beta 0.3 (1.0.0-rc.18)"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: What would a good outcome look like?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Agent
        - Code
        - Library / artifacts
        - Voice
        - Settings
        - Onboarding
        - Installer / distribution
        - Updates
        - Other
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I did not include API keys, tokens, cookies or personal information.
          required: true
