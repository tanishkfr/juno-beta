name: Bug report
description: Report a reproducible problem in Juno v0.5 Beta
title: "[Bug] "
labels: ["bug", "beta"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing **Juno v0.5 Beta** (`0.5.0-rc.1`).

        Before filing, check the [known issues](https://github.com/tanishkfr/juno-beta/blob/main/KNOWN_ISSUES.md).
        The unsigned installer, manual updates, account-scoped ChatGPT models and the external OMP
        requirement for Code are documented boundaries, not new bugs.

        **Security problems:** do not post exploit details here. See
        [SECURITY.md](https://github.com/tanishkfr/juno-beta/blob/main/SECURITY.md) or email
        madebytanishk@gmail.com.

        Remove API keys, tokens, cookies, private paths and personal data from anything you paste.
        Do not attach a raw log without reviewing it. This issue is public.

        You can also report privately from inside Juno: **Settings → Help & feedback → Report a bug →
        Open Email Draft**.
  - type: input
    id: version
    attributes:
      label: Juno version
      description: Settings → General, or the installer filename.
      placeholder: "Juno v0.5 Beta · 0.5.0-rc.1"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: "Example: Windows 11 Home 10.0.26200, x64."
      placeholder: "Windows 11 ..."
    validations:
      required: true
  - type: dropdown
    id: feature
    attributes:
      label: Affected area
      options:
        - Installer / first launch
        - Onboarding
        - Companion conversation
        - Recent Work / history
        - Composer / attachments
        - Code (read-only or editing)
        - Missions / approvals
        - Ariadne verification
        - Model picker / providers
        - ChatGPT-plan connection
        - Settings
        - Updates / version notice
        - Themes / appearance
        - Accessibility / keyboard
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect Juno to do?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened? Include the exact message or status text if there is one.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that shows the problem.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: repeats
    attributes:
      label: Does it repeat?
      options:
        - Every time
        - Sometimes
        - Once
        - Not tried again
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot or safe log
      description: Optional. Redact keys, tokens, file paths, conversation content and personal data.
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I checked the known issues list and this is not a documented limitation.
          required: true
        - label: I removed API keys, tokens, cookies, private paths and personal information from this report.
          required: true
